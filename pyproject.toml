[project]
name = "html-to-pptx"
version = "2.0.0"
description = "Agent Skill for converting HTML presentations and slide images into 100% editable 16:9 PowerPoint (.pptx) decks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=5.0.0",
    "websockets>=13.0",
    "pillow>=10.0.0",
]

[project.scripts]
html-to-pptx = "scripts.convert_html_to_pptx:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
